name: Publication

on:
  push:
    branches:
      - master

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Installer les dependances
        run: npm ci

      - name: Executer ESLint
        run: npm run lint

  test:
    name: Tests Jest
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Installer les dependances
        run: npm ci

      - name: Executer les tests
        run: npm test

  security-deps:
    name: Securite des dependances et secrets
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer tout l'historique Git
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Installer les dependances
        run: npm ci

      - name: Auditer les dependances
        run: npm audit --audit-level=high

      - name: Rechercher les secrets avec Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    name: Build et publication Docker
    runs-on: ubuntu-latest
    environment: production
    needs: 
      - test
      - security-deps



    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USER }}/clickfast-game:${{ github.sha }}

  security-image:
    name: Scan de l'image avec Trivy
    runs-on: ubuntu-latest
    needs: build-and-push



    steps:
      - name: Scanner l'image publiee
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ secrets.DOCKERHUB_USER }}/clickfast-game:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

  generate-sbom:
    name: Generer le SBOM CycloneDX
    runs-on: ubuntu-latest
    needs: build-and-push



    steps:
      - name: Generer le SBOM avec Syft
        uses: anchore/sbom-action@v0
        with:
          image: "${{ secrets.DOCKERHUB_USER }}/clickfast-game:${{ github.sha }}"
          format: cyclonedx-json
          output-file: clickfast-sbom.cdx.json
          upload-artifact: false

      - name: Publier le SBOM comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: clickfast-sbom-${{ github.sha }}
          path: clickfast-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  security-summary:
    name: Resume de securite
    runs-on: ubuntu-latest

    needs:
      - security-deps
      - build-and-push
      - security-image
      - generate-sbom

    if: always()

    steps:
      - name: Telecharger le SBOM
        if: needs.generate-sbom.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: clickfast-sbom-${{ github.sha }}
          path: sbom

      - name: Generer le resume
        shell: bash
        run: |
          SECURITY_DEPS="${{ needs.security-deps.result }}"
          BUILD="${{ needs.build-and-push.result }}"
          TRIVY="${{ needs.security-image.result }}"
          SBOM="${{ needs.generate-sbom.result }}"

          {
            echo "# Resume de securite ClickFast"
            echo
            echo "Commit analyse : \`${{ github.sha }}\`"
            echo
            echo "## Etat des controles"
            echo
            echo "| Controle | Resultat |"
            echo "|---|---|"
            echo "| Dependances npm et Gitleaks | $SECURITY_DEPS |"
            echo "| Build et publication Docker | $BUILD |"
            echo "| Scan Trivy | $TRIVY |"
            echo "| Generation du SBOM | $SBOM |"
            echo
            echo "## Interpretation"
            echo

            if [ "$SECURITY_DEPS" = "success" ]; then
              echo "- Aucune vulnerabilite npm bloquante ni aucun secret n'a ete detecte."
            elif [ "$SECURITY_DEPS" = "skipped" ]; then
              echo "- Le controle npm et Gitleaks a ete ignore."
            else
              echo "- Le controle npm ou Gitleaks a echoue. Consulter le job detaille."
            fi

            if [ "$TRIVY" = "success" ]; then
              echo "- Aucune vulnerabilite HIGH ou CRITICAL bloquante n'a ete detectee par Trivy."
            elif [ "$TRIVY" = "skipped" ]; then
              echo "- Le scan Trivy a ete ignore car aucune image n'a ete publiee."
            else
              echo "- Trivy a detecte un probleme bloquant. Consulter le rapport du job."
            fi

            if [ "$SBOM" = "success" ]; then
              if [ -f sbom/clickfast-sbom.cdx.json ]; then
                COMPONENTS=$(jq '.components | length' sbom/clickfast-sbom.cdx.json)
                echo "- Le SBOM CycloneDX contient $COMPONENTS composants."
              else
                echo "- Le SBOM a ete genere, mais le fichier n'a pas ete retrouve dans l'artefact."
              fi
            elif [ "$SBOM" = "skipped" ]; then
              echo "- La generation du SBOM a ete ignoree."
            else
              echo "- La generation du SBOM a echoue."
            fi

            echo
            echo "## Artefacts"
            echo
            echo "Le SBOM CycloneDX est disponible dans les artefacts du workflow lorsqu'il a ete genere."
          } >> "$GITHUB_STEP_SUMMARY"